name: xsec release

# Builds, smokes and publishes the fork's single-file omp binaries. See
# "Releases" in scripts/xsec/README.md for the assets and the checksum format.
#
# A tag push (v<upstream>-xsec.<n>) publishes a GitHub Release in this
# repository, once tag_guard finds the tagged commit on xsec with a green xsec
# CI push run. A manual run builds, smokes and checksums the same assets and
# stops there, unless create_tag is set: then, once every job has passed on the
# commit the run started on (the head of xsec), create_release_tag pushes the
# tag, and that tag run publishes. Only the publish job is limited to tag pushes.
#
# GitHub-hosted runners only. The one secret, RELEASE_TAG_TOKEN, is read by
# create_release_tag alone, from the xsec-release environment, which deploys
# from xsec only. Its token belongs to a bypass account of the tag ruleset, so
# that job checks out nothing and runs only the steps written here. macOS
# binaries are signed ad hoc by scripts/ci-macos-sign.sh. Never attach a
# self-hosted runner to this repository: it is public, and a pull request could
# run its code on it.

on:
   push:
      tags: ["v*-xsec.*"]
   workflow_dispatch:
      inputs:
         commit:
            description: "Full SHA of xsec's head, the commit this run builds. create_tag requires it to be that commit."
            required: false
            type: string
         version:
            description: "Fork release tag v<upstream>-xsec.<n>, for example v18.20.2-xsec.1 (create_tag requires it)"
            required: false
            type: string
         create_tag:
            description: "Create the tag once every job passed on the commit, so the tag run publishes the release"
            required: false
            type: boolean
            default: false

concurrency:
   group: "xsec-release-${{ github.ref }}"
   cancel-in-progress: false

permissions:
   contents: read

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      runs-on: ubuntu-22.04
      timeout-minutes: 45
      strategy:
         fail-fast: false
         matrix:
            # Each binary is cross-built on Linux when needed, with upstream's
            # prebuilt natives for the same target (scripts/xsec/fetch-natives.ts).
            include:
               - { target_id: linux-x64, binary_path: packages/coding-agent/binaries/omp-linux-x64 }
               - { target_id: darwin-arm64, binary_path: packages/coding-agent/binaries/omp-darwin-arm64 }
               - { target_id: darwin-x64, binary_path: packages/coding-agent/binaries/omp-darwin-x64 }
               - { target_id: win32-x64, binary_path: packages/coding-agent/binaries/omp-windows-x64.exe }
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              persist-credentials: false
         - uses: ./.github/actions/bun-install
         - name: Install prebuilt native addon
           run: bun scripts/xsec/fetch-natives.ts ${{ matrix.target_id }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign macOS binary ad hoc
           # No Apple credentials are configured, so the script signs ad hoc
           # with the release entitlements. It reads only the APPLE_* variables
           # it is given, and this step passes none.
           if: startsWith(matrix.target_id, 'darwin-')
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Upload release binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
              if-no-files-found: error
              retention-days: 7

   release_smoke:
      name: "Smoke release binary: ${{ matrix.target_id }}"
      needs: [release_binary]
      runs-on: ${{ matrix.os }}
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            # The runner images upstream's release_smoke job uses.
            include:
               - { os: ubuntu-22.04, target_id: linux-x64, binary: omp-linux-x64 }
               - { os: macos-15, target_id: darwin-arm64, binary: omp-darwin-arm64 }
               - { os: macos-15-intel, target_id: darwin-x64, binary: omp-darwin-x64 }
               - { os: windows-2025, target_id: win32-x64, binary: omp-windows-x64.exe }
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              persist-credentials: false
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: binaries
         - name: Smoke release binary
           if: runner.os != 'Windows'
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              set -euo pipefail
              chmod +x "$BINARY"
              if [ "$RUNNER_OS" = macOS ]; then codesign --verify --strict --verbose=2 "$BINARY"; fi
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --smoke-test
         - name: Smoke release binary (Windows)
           if: runner.os == 'Windows'
           shell: pwsh
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
              & $env:BINARY --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $env:BINARY --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
         - uses: ./.github/actions/bun-install
         - name: Install prebuilt native addon
           # On Windows the bun-install action leaves bun on PATH for bash only: it installs bun with the
           # Unix script and writes a Git Bash path, which pwsh cannot resolve. So the bun steps run under
           # bash on every leg.
           shell: bash
           run: bun scripts/xsec/fetch-natives.ts ${{ matrix.target_id }}
         - name: ACP contract tests against the release binary
           # The tests start the binary named by XSEC_CONTRACT_OMP, not the source tree, so this step gates
           # what users install. The path is absolute because the tests run from packages/coding-agent.
           shell: bash
           working-directory: packages/coding-agent
           env:
              XSEC_CONTRACT_OMP: ${{ github.workspace }}/binaries/${{ matrix.binary }}
           run: bun test --parallel=1 test/xsec/contract

   release_assets:
      name: Checksum release assets
      needs: [release_smoke]
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              persist-credentials: false
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: release
              merge-multiple: true
         - name: Generate SHA256SUMS
           run: bun run ci:release:checksums release/SHA256SUMS release/omp-darwin-arm64 release/omp-darwin-x64 release/omp-linux-x64 release/omp-windows-x64.exe
         - name: Verify SHA256SUMS
           run: |
              set -euo pipefail
              cd release
              # Exactly the four binaries and their checksum file, nothing else.
              test "$(ls -A | wc -l)" -eq 5
              sha256sum -c SHA256SUMS
         - name: Upload release assets
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-release-assets
              path: release/
              if-no-files-found: error
              retention-days: 7

   tag_guard:
      name: Check the tagged commit
      # A tag may publish only from a commit of xsec whose xsec CI push run
      # succeeded (scripts/xsec/check-release-tag.ts). The job reads only; its
      # token needs actions: read to list the runs. A manual run checks the
      # commit it started on, so from a branch other than xsec it fails, as a
      # tag there would.
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      permissions:
         contents: read
         actions: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              fetch-depth: 0
              persist-credentials: false
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - name: Fetch xsec
           run: git fetch --no-tags origin "+refs/heads/xsec:refs/remotes/origin/xsec"
         - name: Check the commit against xsec and its CI run
           env:
              GITHUB_TOKEN: ${{ github.token }}
           run: bun scripts/xsec/check-release-tag.ts "$GITHUB_SHA"

   create_release_tag:
      name: Create the release tag
      # A manual run with create_tag set tags the commit it started on, and only
      # when every job above passed on it. The tag push then starts the tag run,
      # which publishes. This job is the only one that reads RELEASE_TAG_TOKEN.
      if: github.event_name == 'workflow_dispatch' && inputs.create_tag
      needs: [release_assets, tag_guard]
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      environment: xsec-release
      permissions:
         contents: read
      steps:
         - name: Check the candidate
           env:
              CANDIDATE: ${{ inputs.commit }}
              VERSION: ${{ inputs.version }}
           run: |
              set -euo pipefail
              # The jobs above built, smoked and checked the commit this run started on, so the
              # candidate must be that commit. Only xsec deploys to this environment.
              if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || [ "$CANDIDATE" != "$GITHUB_SHA" ]; then
                 echo "::error::commit must be the full SHA this run started on, $GITHUB_SHA, not '$CANDIDATE'."
                 exit 1
              fi
              if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*-xsec\.[0-9]+$ ]]; then
                 echo "::error::version must be a fork tag such as v18.20.2-xsec.1, not '$VERSION'."
                 exit 1
              fi
         - name: Create the tag
           # GITHUB_TOKEN cannot create a tag the ruleset protects, and a tag it pushes starts no
           # run. This token belongs to a bypass account, and a tag it creates starts the tag run.
           # The request fails when the tag already exists, so no release is tagged twice.
           env:
              GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
              CANDIDATE: ${{ inputs.commit }}
              VERSION: ${{ inputs.version }}
           run: |
              set -euo pipefail
              if [ -z "$GH_TOKEN" ]; then
                 echo "::error::The xsec-release environment has no RELEASE_TAG_TOKEN secret."
                 exit 1
              fi
              tagged="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$CANDIDATE" --jq '.object.sha')"
              test "$tagged" = "$CANDIDATE"
              echo "Tagged $CANDIDATE as $VERSION. The tag run publishes the release."

   publish:
      name: Publish GitHub release
      # Only a tag push publishes, and only once tag_guard passes. A manual run
      # stops after release_assets, or after create_release_tag.
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      needs: [release_assets, tag_guard]
      runs-on: ubuntu-22.04
      timeout-minutes: 15
      permissions:
         contents: write
      steps:
         - name: Download release assets
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-release-assets
              path: release
         - name: Create the release as a draft
           # A draft is complete before anyone sees it. gh refuses an existing
           # release for the tag, so a published release is never overwritten.
           # The notes name the fork tag, the commit and the upstream version,
           # which is what Desktop pins besides the SHA-256 values.
           env:
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ github.ref_name }}
              COMMIT: ${{ github.sha }}
           run: |
              set -euo pipefail
              upstream="${TAG#v}"
              upstream="${upstream%-xsec.*}"
              notes="$RUNNER_TEMP/release-notes.md"
              printf '%s\n' \
                "Fork release $TAG of XSec's oh-my-pi, built from commit $COMMIT on upstream v$upstream." \
                "" \
                "Verify the binaries with SHA256SUMS. Desktop identifies a build by this tag and its SHA-256, not by the version that omp --version prints ($upstream)." > "$notes"
              cd release
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes-file "$notes" omp-darwin-arm64 omp-darwin-x64 omp-linux-x64 omp-windows-x64.exe SHA256SUMS
         - name: Publish the release
           env:
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ github.ref_name }}
           run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
