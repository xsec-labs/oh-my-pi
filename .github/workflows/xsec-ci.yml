name: xsec CI

# Checks for the xsec fork (see scripts/xsec/README.md).
#
# Upstream's own workflows are disabled in this repository: they need
# upstream's runners and publishing secrets. Every pull request to `xsec` runs
# the fork's checks, the fork's own tests, upstream's CLI smoke entry and the
# upstream test files listed in upstream-allowlist.txt ("everyday" mode). Sync
# pull requests (head `sync/*`) and manual runs also run upstream's full
# pull-request suite, judged by run-full-suite.ts against
# upstream-known-failures.txt. The fork does not change Rust, so native addons
# are upstream's prebuilt ones from npm, and the Rust, bazel, install-method and
# release jobs do not run.
#
# Self-hosted runners must never be attached to this repository: it is public,
# and a pull request could run its code on them.

on:
   pull_request:
      branches: [xsec]
   push:
      branches: [xsec]
   workflow_dispatch:

concurrency:
   group: "xsec-ci-${{ github.ref }}"
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
   contents: read

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   # Same per-test ceiling upstream's CI uses.
   OMP_TEST_TIMEOUT: "120"

jobs:
   scope:
      name: Fork scope
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      permissions:
         contents: read
         actions: read
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Upstream files changed by the fork
           run: bun scripts/xsec/check-upstream-diff.ts
         - name: Upstream workflows stay disabled
           env:
              GITHUB_TOKEN: ${{ github.token }}
           run: bun scripts/xsec/check-workflows.ts
         - name: Test fork scripts
           run: bun test scripts/xsec

   check:
      name: Lint, type check & web build
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Type check workspace
           run: bun run ci:check:full
         - name: Build collab web
           run: bun run collab:web:build
         # Upstream's bun-install action saves the package store on `main`
         # only, a branch this fork never builds. Save it from `xsec` so pull
         # requests restore it instead of downloading the store every run.
         - name: Save bun store
           if: github.ref == 'refs/heads/xsec'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

   everyday:
      name: Fork and related tests
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      env:
         # The settings scripts/ci-test-ts.ts gives upstream's test processes.
         PI_TEST_RUNTIME: "1"
         BUN_JSC_useConcurrentGC: "0"
         BUN_JSC_numberOfGCMarkers: "1"
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Install prebuilt native addons
           run: bun scripts/xsec/fetch-natives.ts linux-x64
         - name: Fork coding-agent tests
           run: |
              if [ -d packages/coding-agent/test/xsec ]; then
                 cd packages/coding-agent
                 bun test --parallel=1 --timeout="$((OMP_TEST_TIMEOUT * 1000))" test/xsec
              else
                 echo "packages/coding-agent/test/xsec does not exist yet; nothing to run."
              fi
         - name: CLI smoke
           run: bun run ci:test:smoke
         - name: Related upstream tests
           run: |
              listed="$(bun scripts/xsec/list-test-paths.ts)"
              if [ -z "$listed" ]; then
                 echo "upstream-allowlist.txt lists no upstream test file yet; nothing to run."
                 exit 0
              fi
              while read -r dir file; do
                 echo "==> $dir: $file"
                 (cd "$dir" && bun test --parallel=1 --timeout="$((OMP_TEST_TIMEOUT * 1000))" "$file")
              done <<< "$listed"

   test:
      name: "Test ${{ matrix.name }}"
      # Upstream's full pull-request suite: sync pull requests and manual runs.
      if: startsWith(github.head_ref, 'sync/') || github.event_name == 'workflow_dispatch'
      runs-on: ubuntu-22.04
      timeout-minutes: ${{ matrix.timeout }}
      strategy:
         fail-fast: false
         matrix:
            # One entry per upstream test_* pull-request job, with upstream's
            # script, shard, concurrency and timeout (minutes).
            include:
               # Known failure: upstream's test browser-relay-detach races a 750 ms
               # wall-clock window and fails intermittently on loaded runners. It
               # still runs; run-full-suite.ts accepts only the failures listed in
               # upstream-known-failures.txt. See scripts/xsec/README.md.
               - { name: "coding-agent native 1/3", script: "ci:test:coding-agent:native", shard: "1/3", concurrency: "4", timeout: 25 }
               - { name: "coding-agent native 2/3", script: "ci:test:coding-agent:native", shard: "2/3", concurrency: "4", timeout: 25 }
               - { name: "coding-agent native 3/3", script: "ci:test:coding-agent:native", shard: "3/3", concurrency: "4", timeout: 25 }
               - { name: "coding-agent runtime", script: "ci:test:coding-agent:runtime", concurrency: "4", timeout: 25 }
               - { name: "coding-agent ui", script: "ci:test:coding-agent:ui", concurrency: "2", timeout: 25 }
               - { name: "coding-agent singleton", script: "ci:test:coding-agent:singleton", timeout: 20 }
               - { name: "workspace", script: "ci:test:ts:workspace", concurrency: "4", timeout: 20 }
               - { name: "native packages", script: "ci:test:ts:native", concurrency: "4", omp_tools: true, timeout: 25 }
               - { name: "cli smoke", script: "ci:test:smoke", timeout: 15 }
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Install prebuilt native addons
           run: bun scripts/xsec/fetch-natives.ts linux-x64
         - name: Install project-local TUI debug tool dependencies
           if: matrix.omp_tools
           run: bun install --cwd .omp/tools --frozen-lockfile
         # The runner entries are judged against upstream-known-failures.txt. The
         # CLI smoke entry is not a test runner and runs as it is.
         - name: Run ${{ matrix.script }}
           if: matrix.script != 'ci:test:smoke'
           env:
              OMP_TEST_CONCURRENCY: ${{ matrix.concurrency }}
              OMP_TEST_SHARD: ${{ matrix.shard }}
           run: bun scripts/xsec/run-full-suite.ts ${{ matrix.script }}
         - name: Run ${{ matrix.script }}
           if: matrix.script == 'ci:test:smoke'
           run: bun run ${{ matrix.script }}
